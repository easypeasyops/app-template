# java-template's values for the platform's service chart (easypeasyops/platform
# charts/service), shared by every environment. Argo CD renders the app from that chart,
# pinned by digest in the platform's apps/java-template/envs/<env>.yaml, with these values
# from this repo, layered as
#   deploy/service/values.yaml             this file
#   deploy/service/slo-rules.values.yaml   prod only: the SLO rules (generated)
#   deploy/envs/<env>.yaml                 the environment's settings and image digest
# CI renders every environment with the chart and validates the result (ci.yml, deploy).
# The chart's own values.yaml documents everything an app can set: a database, Redis,
# workers, cron jobs, secret env, canary releases.

app:
  name: java-template

image:
  # ghcr.io/easypeasyops/<repo>/<app>: the admission policy reads the repo and the app from
  # this name. Each environment names its release's digest (deploy/envs/).
  repository: ghcr.io/easypeasyops/app-template/java-template

# Start small and fixed; size from a load test before turning the chart's autoscaling on.
autoscaling:
  enabled: false
replicaCount: 1
# A JVM needs more than a Python process: the heap is 75% of the limit (Dockerfile), the
# rest is metaspace, threads and code cache. Start-up uses a burst of CPU; no CPU limit, so
# it isn't throttled.
resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { memory: 384Mi }

# The app's environment. Keys that can't be in git come from the app's store in the
# platform (the chart's `secretEnv`).
env:
  - { name: METRICS_PORT, value: "{{ .Values.config.metricsPort }}" }

gateway:
  enabled: true
  hostnames: [] # each environment's (deploy/envs/)

monitoring:
  enabled: true # Prometheus scrapes /metrics on 9100
  # The platform's SLO dashboard comes with the SLO rules; its Runbook link.
  sloDashboard:
    runbookUrl: https://github.com/easypeasyops/app-template/blob/main/README.md#slo-burn-rate-alerts

# Canary releases (the chart's `canary`; links' docs/DESIGN.md, Canary releases): off. On,
# Argo Rollouts replaces the Deployment and a new release gets 10%, then 50% of the front
# door's traffic, each step judged by Prometheus on the canary's own pods (5xx share, request
# rate); a bad step aborts it and all traffic stays on the old release. Each release then
# takes about 6 minutes longer (2 steps of 60 s + 4 x 30 s). Turn it on per environment, in
# deploy/envs/<env>.yaml: `canary: { enabled: true }`. CI renders it on, so it stays valid.
canary:
  enabled: false
  analysis:
    # Requests to judge the canary on: a k6 Job sends RATE req/s to `/` through the front
    # door, with the environment's first hostname, for each analysis step. Change the
    # routes to the app's, in the mix its users send.
    syntheticTraffic:
      script: |
        import http from "k6/http";

        export const options = {
          discardResponseBodies: true,
          scenarios: {
            hello: {
              executor: "constant-arrival-rate", rate: Number(__ENV.RATE || 20), timeUnit: "1s",
              duration: __ENV.DURATION || "180s", preAllocatedVUs: 5, maxVUs: 20,
            },
          },
        };

        export default function () {
          http.get(`${__ENV.BASE_URL}/`, { headers: { Host: __ENV.HOST } });
        }
