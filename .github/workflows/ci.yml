name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # e.g. the kind e2e on a branch (the e2e jobs below)

# Least privilege: the default GITHUB_TOKEN can write to the repo; CI only needs to read.
permissions:
  contents: read

# A new push to the same PR/branch cancels the now-stale run. A manual run (the kind e2e) has
# a group of its own: a merge to main mustn't cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Docs-only PRs skip the work in every job (scripts/ci-scope.sh).
  scope:
    name: change scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # CHART is the latest service chart release, which the deploy and e2e jobs render with:
    # Renovate moves it (.github/renovate.json5), keep version and digest together. Here, to
    # be one line: a reusable workflow's inputs can't read another job's env, only outputs.
    env:
      CHART: oci://ghcr.io/easypeasyops/charts/service@sha256:11a7ca25f34cd7a16bf2fbd4a5ad86e3bbc556f19f9ab236e1c2b05f50fb6a7f # 1.7.1
    outputs:
      full: ${{ steps.scope.outputs.full }}
      chart: ${{ env.CHART }}
      # The e2e jobs (<lang>-e2e): each app deployed on a kind cluster with the platform at
      # platform.lock's commit and the chart CHART pins, with its staging values, then
      # checked: workloads Ready, the front door on each hostname, metrics targets up,
      # PrometheusRules loaded (the platform's reusable-kind-e2e.yml). About 15 minutes, so
      # only where the platform or the chart moves: Renovate's lock and chart PRs (renovate/
      # branches), and a manual run (Actions, CI, Run workflow). Other PRs and pushes to main
      # skip it, which still reports success.
      e2e: >-
        ${{ steps.scope.outputs.full == 'true' && (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/'))) }}
      onboarded: ${{ steps.onboarded.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its first parent
      - name: Does this change need the checks?
        id: scope
        run: scripts/ci-scope.sh
      - name: platform.lock and ci.yml name the same platform commit
        run: scripts/check-platform-lock.sh
      # The e2e deploys an app with the values files its platform env file lists, or, for an
      # app the platform doesn't run yet (the templates), with the ones its job names: which
      # apps the platform at platform.lock's commit runs in staging, as a JSON list.
      - name: Apps the locked platform runs in staging
        id: onboarded
        run: |
          sha=$(sed -nE 's/^easypeasyops\/platform@([0-9a-f]{40})$/\1/p' platform.lock)
          apps=()
          for d in apps/*/; do
            app=$(basename "$d")
            if curl -sfo /dev/null "https://raw.githubusercontent.com/easypeasyops/platform/$sha/apps/$app/envs/staging.yaml"; then
              apps+=("$app")
            fi
          done
          echo "apps=$(jq -cn '$ARGS.positional' --args "${apps[@]}")" | tee -a "$GITHUB_OUTPUT"

  # The platform's reusable workflows, pinned to platform.lock's commit
  # (scripts/check-platform-lock.sh keeps them equal; Renovate moves them together).
  check:
    needs: scope
    uses: easypeasyops/platform/.github/workflows/reusable-python-check.yml@81cc2177cc0e6361f186c798688ce1b6e2480db4 # platform.lock
    with:
      run: ${{ needs.scope.outputs.full == 'true' }}
      working-directory: apps/python-template
      typecheck-paths: app tests

  image:
    needs: scope
    uses: easypeasyops/platform/.github/workflows/reusable-image.yml@81cc2177cc0e6361f186c798688ce1b6e2480db4 # platform.lock
    with:
      run: ${{ needs.scope.outputs.full == 'true' }}
      context: apps/python-template
      smoke-command: apps/python-template/scripts/smoke.sh # reads $IMAGE

  java-check:
    needs: scope
    uses: easypeasyops/platform/.github/workflows/reusable-java-check.yml@81cc2177cc0e6361f186c798688ce1b6e2480db4 # platform.lock
    with:
      run: ${{ needs.scope.outputs.full == 'true' }}
      working-directory: apps/java-template

  java-image:
    needs: scope
    uses: easypeasyops/platform/.github/workflows/reusable-image.yml@81cc2177cc0e6361f186c798688ce1b6e2480db4 # platform.lock
    with:
      run: ${{ needs.scope.outputs.full == 'true' }}
      context: apps/java-template
      smoke-command: apps/java-template/scripts/smoke.sh # reads $IMAGE

  rust-check:
    needs: scope
    uses: easypeasyops/platform/.github/workflows/reusable-rust-check.yml@81cc2177cc0e6361f186c798688ce1b6e2480db4 # platform.lock
    with:
      run: ${{ needs.scope.outputs.full == 'true' }}
      working-directory: apps/rust-template

  rust-image:
    needs: scope
    uses: easypeasyops/platform/.github/workflows/reusable-image.yml@81cc2177cc0e6361f186c798688ce1b6e2480db4 # platform.lock
    with:
      run: ${{ needs.scope.outputs.full == 'true' }}
      context: apps/rust-template
      smoke-command: apps/rust-template/scripts/smoke.sh # reads $IMAGE

  # Each app's deploy values (apps/<app>/deploy/), rendered for each environment with the
  # platform's service chart as Argo CD will, and schema-checked, with the chart release the
  # scope job names (CHART).
  deploy:
    name: deploy values
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHART: ${{ needs.scope.outputs.chart }}
      CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce
      KUBECONFORM: ghcr.io/yannh/kubeconform:v0.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.full == 'true'
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        if: needs.scope.outputs.full == 'true'
        with:
          version: v4.3.1
      # The SLO rules are generated (deploy/prometheus/slos.yaml): the committed file must
      # be what the platform's generator, at platform.lock's commit, writes from the spec.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.full == 'true'
        with:
          repository: easypeasyops/platform
          ref: 81cc2177cc0e6361f186c798688ce1b6e2480db4 # platform.lock
          path: platform
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.scope.outputs.full == 'true'
        with:
          enable-cache: false
      - name: SLO rules match their spec
        if: needs.scope.outputs.full == 'true'
        working-directory: apps
        run: |
          for spec in */deploy/prometheus/slos.yaml; do
            (cd "${spec%%/*}" && uv run --script ../../platform/scripts/gen_slo_rules.py --check \
              --spec deploy/prometheus/slos.yaml \
              --values --out deploy/service/slo-rules.values.yaml)
          done
      - name: Render each environment and validate it
        if: needs.scope.outputs.full == 'true'
        working-directory: apps
        run: |
          # An env file without a release yet renders with a placeholder digest.
          placeholder="sha256:$(printf '0%.0s' {1..64})"
          mkdir -p /tmp/rendered
          for env_file in */deploy/envs/*.yaml; do
            app=${env_file%%/*} env=$(basename "$env_file" .yaml)
            digest=$(yq -r '.image.digest // ""' "$env_file")
            # Prod ships the SLO rules, as the platform's apps/<app>/envs/prod.yaml layers them.
            slo=()
            if [[ "$env" == prod && -f "$app/deploy/service/slo-rules.values.yaml" ]]; then
              slo=(--values "$app/deploy/service/slo-rules.values.yaml")
            fi
            helm template "$app" "$CHART" --namespace "$app-$env" \
              --values "$app/deploy/service/values.yaml" "${slo[@]}" --values "$env_file" \
              --set "image.digest=${digest:-$placeholder}" \
              --kube-version 1.37.0 \
              --api-versions monitoring.coreos.com/v1/ServiceMonitor \
              --api-versions monitoring.coreos.com/v1/PodMonitor \
              --api-versions monitoring.coreos.com/v1/PrometheusRule >"/tmp/rendered/$app-$env.yaml"
            echo "$app $env: $(grep -c '^kind:' "/tmp/rendered/$app-$env.yaml") objects"
          done
          # Canary releases are off in the templates (values.yaml): staging rendered with
          # them on too, so the block stays valid for the app that turns it on.
          for app in */; do
            app=${app%/}
            [[ -f "$app/deploy/envs/staging.yaml" ]] || continue
            helm template "$app" "$CHART" --namespace "$app-staging" \
              --values "$app/deploy/service/values.yaml" --values "$app/deploy/envs/staging.yaml" \
              --set "image.digest=$placeholder" --set canary.enabled=true \
              --kube-version 1.37.0 \
              --api-versions monitoring.coreos.com/v1/ServiceMonitor \
              --api-versions monitoring.coreos.com/v1/PodMonitor \
              --api-versions monitoring.coreos.com/v1/PrometheusRule >"/tmp/rendered/$app-staging-canary.yaml"
            echo "$app staging, canary on: $(grep -c '^kind:' "/tmp/rendered/$app-staging-canary.yaml") objects"
          done
          docker run --rm -v /tmp/rendered:/r:ro -w /r "$KUBECONFORM" -strict -summary \
            -kubernetes-version 1.37.0 -schema-location default \
            -schema-location "$CRDS/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            .

  e2e:
    needs: scope
    uses: easypeasyops/platform/.github/workflows/reusable-kind-e2e.yml@81cc2177cc0e6361f186c798688ce1b6e2480db4 # platform.lock
    with:
      run: ${{ needs.scope.outputs.e2e == 'true' }}
      app: python-template
      env: staging
      context: apps/python-template
      chart: ${{ needs.scope.outputs.chart }}
      values-files: >-
        ${{ !contains(fromJSON(needs.scope.outputs.onboarded), 'python-template') &&
        'apps/python-template/deploy/service/values.yaml apps/python-template/deploy/envs/staging.yaml' || '' }}

  java-e2e:
    needs: scope
    uses: easypeasyops/platform/.github/workflows/reusable-kind-e2e.yml@81cc2177cc0e6361f186c798688ce1b6e2480db4 # platform.lock
    with:
      run: ${{ needs.scope.outputs.e2e == 'true' }}
      app: java-template
      env: staging
      context: apps/java-template
      chart: ${{ needs.scope.outputs.chart }}
      values-files: >-
        ${{ !contains(fromJSON(needs.scope.outputs.onboarded), 'java-template') &&
        'apps/java-template/deploy/service/values.yaml apps/java-template/deploy/envs/staging.yaml' || '' }}

  rust-e2e:
    needs: scope
    uses: easypeasyops/platform/.github/workflows/reusable-kind-e2e.yml@81cc2177cc0e6361f186c798688ce1b6e2480db4 # platform.lock
    with:
      run: ${{ needs.scope.outputs.e2e == 'true' }}
      app: rust-template
      env: staging
      context: apps/rust-template
      chart: ${{ needs.scope.outputs.chart }}
      values-files: >-
        ${{ !contains(fromJSON(needs.scope.outputs.onboarded), 'rust-template') &&
        'apps/rust-template/deploy/service/values.yaml apps/rust-template/deploy/envs/staging.yaml' || '' }}

  # The one required check: green only when every job above passed (or was skipped as
  # docs-only by its own input, which still reports success).
  gate:
    name: ci
    if: always()
    needs: [scope, check, image, e2e, java-check, java-image, java-e2e, rust-check, rust-image, rust-e2e, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
